[project]
name = "flashoutbox"
version = "0.1.0"
description = "A simple application to remote control basic functions of a lighting console"
authors = [
    {name = "Morph Tollon",email = "code@morphtollon.co.uk"}
]
license = {file = "../../LICENSE"}
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "pyopensoundcontrol (>=1.1.1,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "pyright (>=1.1.409,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false